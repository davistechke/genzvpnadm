{% extends "base.html" %}
{% block title %}Edit app · GenzVPN{% endblock %}
{% block content %}
<h1>Edit {{ a.name }}</h1>
<form method="post" enctype="multipart/form-data" class="stack">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="grid2">
    <div><label for="name">App name</label><input id="name" name="name" value="{{ a.name }}" required></div>
    <div><label for="version">Version (optional)</label><input id="version" name="version" value="{{ a.version }}"></div>
  </div>
  <div><label for="apk">Replace the APK (optional)</label><input id="apk" name="apk" type="file" accept=".apk,application/vnd.android.package-archive">
    <p class="hint">Current file: {{ a.size | filesize }}. Leave empty to keep it.</p></div>
  <div><label for="description">Description</label><textarea id="description" name="description" rows="4">{{ a.description }}</textarea></div>
  <div class="checks">
    <label><input type="checkbox" name="is_published" value="1" {{ 'checked' if a.is_published }}> Show on the home page</label>
    <label><input type="checkbox" name="rights" value="1"> I am allowed to share this app (needed only when replacing the file)</label>
  </div>
  <p><button class="btn">Save</button> <a class="btn ghost" href="{{ url_for('admin.home', tab='freeapps') }}">Cancel</a></p>
</form>
{% endblock %}
